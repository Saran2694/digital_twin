
server.port=8080
server.error.include-message=always

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/digital_twin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# File Upload
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Security
twin.jwt.secret=change-this-secret-key-to-a-long-random-string-0123456789
twin.jwt.expiry-minutes=720
twin.cors.allowed-origins=http://localhost:5173,http://localhost:3000
twin.admin.username=admin
twin.admin.password=digitaladmin12
twin.admin.full-name=John Doe

# Data Import
twin.import.on-startup=true
twin.import.file=classpath:data/Metal_component-LAST_6_MONTHS_DATA.xlsx

# Equipment Status Rules
twin.status.window-days=7
twin.status.warn-defect-rate=0.10
twin.status.temp-sigma=3.0
twin.status.offline-days=2
